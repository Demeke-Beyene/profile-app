<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Profile</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

  <div class="container">
    <div class="card">
      <h1>My Profile</h1>

      <button onclick="loadProfile()">Load Profile</button>

      <div class="info">
        <p><span>Name:</span> <b id="name">-</b></p>
        <p><span>Title:</span> <b id="title">-</b></p>
        <p><span>Skills:</span> <b id="skills">-</b></p>
        <p><span>Experience:</span> <b id="experience">-</b></p>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
